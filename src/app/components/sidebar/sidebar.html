<nav
  [class.translate-x-0]="isSidebarOpen()"
  [class.-translate-x-full]="!isSidebarOpen()"
  class="h-screen w-64 flex flex-col fixed left-0 top-0 bg-surface border-r border-outline-variant/60 py-6 px-4 z-50 transition-transform duration-300 ease-in-out lg:translate-x-0 lg:shadow-none"
>
  <button
    type="button"
    (click)="closeSidebarAndNavigate()"
    class="absolute top-3 right-3 w-11 h-11 flex items-center justify-center rounded-xl text-on-surface-variant hover:bg-surface-container transition-colors lg:hidden"
    aria-label="Cerrar menú lateral"
  >
    <span class="material-symbols-outlined">close</span>
  </button>

  <!-- Logo -->
  <div class="mb-10 flex items-center gap-2 pr-12">
    <div class="w-10 h-10 bg-primary-fixed rounded-lg flex items-center justify-center text-primary">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">
        engineering
      </span>
    </div>

    <div>
      <h1 class="text-[20px] font-bold text-on-surface leading-tight">
        AtencIA SaaS
      </h1>
      <p class="text-[12px] font-medium text-on-surface-variant">
        Enterprise Tier
      </p>
    </div>
  </div>

  <!-- Navigation -->
  <div class="flex-1 space-y-1">

    <a routerLink="/dashboard"
      (click)="closeSidebarAndNavigate()"
      routerLinkActive="sidebar-link-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      class="sidebar-link flex items-center gap-4 text-on-surface-variant hover:bg-surface-container-highest hover:text-primary px-4 py-2 transition-colors duration-200 rounded-lg">
      <span class="material-symbols-outlined">dashboard</span>
      <span class="text-[14px] font-semibold">Dashboard</span>
    </a>

    <a routerLink="/appointments"
      (click)="closeSidebarAndNavigate()"
      routerLinkActive="sidebar-link-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      class="sidebar-link flex items-center gap-4 text-on-surface-variant hover:bg-surface-container-highest hover:text-primary px-4 py-2 transition-colors duration-200 rounded-lg">
      <span class="material-symbols-outlined">calendar_today</span>
      <span class="text-[14px] font-semibold">Appointments</span>
    </a>

    <a routerLink="/technician-mobile"
      (click)="closeSidebarAndNavigate()"
      routerLinkActive="sidebar-link-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      class="sidebar-link flex items-center gap-4 text-on-surface-variant hover:bg-surface-container-highest hover:text-primary px-4 py-2 transition-colors duration-200 rounded-lg">
      <span class="material-symbols-outlined">assignment_ind</span>
      <span class="text-[14px] font-semibold">Mis Citas</span>
    </a>

    <a routerLink="/payment-validation"
      (click)="closeSidebarAndNavigate()"
      routerLinkActive="sidebar-link-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      class="sidebar-link flex items-center gap-4 text-on-surface-variant hover:bg-surface-container-highest hover:text-primary px-4 py-2 transition-colors duration-200 rounded-lg">
      <span class="material-symbols-outlined">payments</span>
      <span class="text-[14px] font-semibold">Validación de pagos</span>
    </a>

    <a routerLink="/register-technician"
      (click)="closeSidebarAndNavigate()"
      routerLinkActive="sidebar-link-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      class="sidebar-link flex items-center gap-4 text-on-surface-variant hover:bg-surface-container-highest hover:text-primary px-4 py-2 transition-colors duration-200 rounded-lg">
      <span class="material-symbols-outlined">person_add</span>
      <span class="text-[14px] font-semibold">Registrar técnico</span>
    </a>

    <a routerLink="/business-configuration"
      (click)="closeSidebarAndNavigate()"
      routerLinkActive="sidebar-link-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      class="sidebar-link flex items-center gap-4 text-on-surface-variant hover:bg-surface-container-highest hover:text-primary px-4 py-2 transition-colors duration-200 rounded-lg">
      <span class="material-symbols-outlined">hub</span>
      <span class="text-[14px] font-semibold">Contexto para n8n</span>
    </a>

  </div>

  <!-- Bottom navigation -->
  <div class="border-t border-outline-variant/60 pt-4 space-y-1">

    <a href="#"
      class="flex items-center gap-4 text-on-surface-variant hover:text-primary px-4 py-2 transition-colors">
      <span class="material-symbols-outlined">help</span>
      <span class="text-[14px] font-semibold">Help Center</span>
    </a>

    <button type="button"
      (click)="logout()"
      class="w-full flex items-center gap-4 text-on-surface-variant hover:text-primary px-4 py-2 transition-colors">
      <span class="material-symbols-outlined">logout</span>
      <span class="text-[14px] font-semibold">Log Out</span>
    </button>

  </div>
</nav>

@if (isSidebarOpen()) {
  <button
    type="button"
    (click)="closeSidebarAndNavigate()"
    class="fixed inset-0 bg-on-surface/40 backdrop-blur-sm z-40 lg:hidden"
    aria-label="Cerrar menú lateral"
  ></button>
}

@if (!isSidebarOpen()) {
  <button
    type="button"
    (click)="toggleSidebar()"
    class="fixed top-3 left-3 z-[60] w-11 h-11 flex items-center justify-center rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface shadow-sm lg:hidden"
    aria-label="Abrir menú lateral"
  >
    <span class="material-symbols-outlined">menu</span>
  </button>
}
